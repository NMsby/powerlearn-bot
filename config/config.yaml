# PowerLearn LMS Bot Configuration

# Browser Settings
browser:
  type: chromium  # chromium, firefox, or webkit
  headless: false
  viewport:
    width: 1280
    height: 800
  timeout: 30000  # milliseconds
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36"

# LMS Settings
lms:
  url: "https://academy.powerlearnprojectafrica.org/login"  # LMS Login Page
  dashboard_url: "https://academy.powerlearnprojectafrica.org/"  # LMS My Learning page
  login_selectors:
    email_field: "input[name='email']"  # Email field
    password_field: "input[name='password']"  # Password field
    submit_button: "button[type='submit']"  # Login submit button
  logged_in_indicators:
    - ".MuiAvatar-root.MuiAvatar-circular"  # User avatar in header
    - ".h-screen.top-32.fixed.w-1\/6.hidden.xl\\:flex"  # Sidebar navigation that only appears when logged in
    - "[data-testid='DashboardIcon']"  # Dashboard icon in sidebar
    - "[href='/dashboard']"  # Dashboard link
    - "[href='/submissions']"  # Submissions link
  logout_selectors:
    menu_button: ".MuiButtonBase-root.MuiIconButton-root .MuiAvatar-root, .MuiButtonBase-root.MuiIconButton-root .MuiAvatar-img"  # Avatar button that opens popup
    logout_link: ".MuiListItemButton-root:has([data-testid='LogoutIcon'])"  # The list item button containing the logout icon

# Session Settings
session:
  duration: 300  # seconds (5 minutes)
  pause_between: 10  # seconds
  max_retries: 3
  backoff_factor: 2  # exponential backoff multiplier

# Activity Simulation
activity:
  enabled: true
  actions:
    - type: "navigate"
      urls:
        - "https://academy.powerlearnprojectafrica.org/dashboard"
      probability: 1.0
    - type: "wait"
      min_duration: 10
      max_duration: 30
      probability: 0.5
  min_actions_per_session: 3
  max_actions_per_session: 4

# Proxy Settings
proxy:
  enabled: false
  url: ""  # Set via environment variable

# Logging Configuration
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  file: "logs/powerlearn_bot.log"
  max_size: 10485760  # 10MB
  backup_count: 5
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# Screenshots
screenshots:
  enabled: true
  on_error: true
  periodic: false
  periodic_interval: 300  # seconds
  path: "screenshots/"